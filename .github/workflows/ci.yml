name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Storage registry (diagnostics)
        run: ioreg -r -c IOBlockStorageDevice -l -w0 | grep -E '"(Device|Protocol) Characteristics"|IOBlockStorageDevice|"BSD Name"|"Size"|"Model Number"' | head -40

      - name: Build
        run: swift build

      - name: Test
        run: swift test
